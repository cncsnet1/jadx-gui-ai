source=Candidate source
stage=Open in Repeater
stage_confirm=Create a Repeater tab containing this request. Confirm the destination, protocol, and port below. This action does not send the request to the target; use Burp to review and send it.
staging=Creating a Repeater tab…
staged=Repeater tab created. Review and send the request in Burp.
cannot_stage=This snapshot cannot be forwarded reliably (truncation, HTTP/2, binary/non-ASCII text, chunked body, framing, or size). Open the original request in Burp.
stage_failed=Burp rejected the Repeater operation. Check its extension log and permissions before retrying.
stage_unknown=Burp returned an unfamiliar result. Check Repeater before retrying; the tab may already exist.
read_failed=Burp history was denied, malformed, or incompatible. Check extension permissions and version; this is not an empty successful read.
incompatible=The connected tool catalog does not match the supported PortSwigger history/Repeater schema. Check the official extension version.
operation_failed=Burp operation failed. Check the connection and retry explicitly.
cancelled=Stopped. A cancelled stdio call may require reconnection; an already-created Repeater tab is not undone.
