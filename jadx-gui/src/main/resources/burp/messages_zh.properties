title=实际流量
intro=连接 Burp，选定目标地址后读取已捕获的历史记录。读取流量不会访问目标，也不会调用 AI。
empty=选择一条已捕获的请求，与当前 API 对照。请先在 Burp 抓到流量，再在这里读取。
connection=Burp 连接
connect=连接 Burp
connecting=正在检测并连接本机 Burp…
connected=连接成功。请确认目标地址的 HTTP/HTTPS 和端口，然后读取已捕获流量。
offline=未连接
origin=选定目标地址
origin_hint=填写 https://api.example.com:8443 这样的目标地址。历史记录可能不包含原始 TLS 和端口信息。
invalid_origin=请填写包含主机和可选端口的完整 HTTP/HTTPS 地址，不包含路径、凭据、查询参数或片段。
read=读取流量
more=下一页 50 条
cancel=停止
reading=正在读取一页 Burp 历史记录…
read_summary=已读 %d 条 · 范围内 %d 条 · 跳过 %d 条（格式异常或不在范围内）
end=已到当前历史末尾。没有匹配不代表接口未使用；请检查抓包、目标范围及缺失的基础地址。
limit=已到本次 500 条上限。可在 Burp 缩小捕获范围或重新读取，当前结果不代表全部历史。
more_hint=可能还有记录，可继续读取下一页；翻页期间 Burp 历史可能变化。
session=本次会话
match_details=匹配依据
saved_evidence=已保存证据
clear_saved=移除此接口的已保存证据
no_saved=此接口尚未保留流量证据。选择匹配请求，保留证据后保存项目。
method=方法
path=观察到的路径
status=响应状态
match=关联依据
features=特征一致
candidate=候选关系
features_reason=请求方法、主机和路径模式一致，仍不能证明具体哪个代码方法被执行。
method_unknown=主机和路径一致，但静态 HTTP 方法未知。
host_unknown=方法与路径可对应，但代码中的基础地址尚未关联。
unmatched=当前接口没有可确认的匹配。可选择其他声明或先梳理客户端关系；运行时地址仍保持未知。
query_names=查询字段名
header_names=请求头名称
collected=本地读取时间
truncated=Burp 截断了部分报文，缺失内容保持未知。
evidence_boundary=目标地址由用户选定，TLS/端口可能未被观察到。保留的证据包含大小限制内的原始请求和响应。关联不代表代码实际可达或漏洞成立。
raw=查看原始报文
raw_title=原始请求与响应
request=请求
response=响应
retain=保留此证据
retained=已保留原文证据。保存 .jadx 项目即可持久保留，报告和 API 导出也会包含此证据。
evidence_limit=已到证据上限（每接口 20 条 / 每项目 200 条）。
source=查看候选源码
stage=送到 Repeater
stage_confirm=把这条请求放入 Repeater 标签页。请确认下面的目标、协议和端口。此操作不会向目标发出请求，请在 Burp 中检查并发送。
staging=正在创建 Repeater 标签页…
staged=已创建 Repeater 标签页，请在 Burp 中检查并发送。
cannot_stage=此快照无法可靠转交：可能已截断、使用 HTTP/2、含二进制或非 ASCII 文本、分块正文、报文长度不一致或超过大小限制。请在 Burp 中打开原始请求。
stage_failed=Burp 拒绝了 Repeater 操作，请检查扩展日志和权限后再重试。
stage_unknown=Burp 返回了无法识别的结果。请先查看 Repeater，标签页可能已经创建。
read_failed=Burp 历史读取被拒绝、格式异常或不兼容。请检查扩展权限与版本；这不代表成功读取到空历史。
incompatible=工具目录与支持的 PortSwigger 历史 / Repeater 参数格式不符，请检查官方扩展版本。
operation_failed=Burp 操作失败，请检查连接后手动重试。
cancelled=已停止。取消请求后可能需要重新连接；已创建的 Repeater 标签页不会撤销。
advanced=MCP 设置
options=更多…
setup_hint=打开 Burp，在 Extensions → BApp Store 搜索并安装 MCP Server，再在 MCP 页勾选 Enabled。通常直接点击「连接 Burp」即可；只有改过端口时才需要修改下面的地址。
proxy_jar=官方 mcp-proxy-all.jar
browse=浏览…
server_url=本机 Burp MCP 服务地址
java=Java 程序（默认使用当前运行环境）
setup_invalid=请填写本机 HTTP 地址，例如 http://127.0.0.1:9876，不包含凭据、路径或查询参数。
connection_settings=连接地址…
install_help=打开 Burp 扩展安装页
connect_failed=尚未连上 Burp。请打开 Burp，并在 MCP 页勾选 Enabled，然后再次连接。尚未安装 MCP Server，或改过端口？使用下方按钮处理。
