key.direction.native=Explain the known ELF structure, architecture, imported/exported symbols and JNI clues of this library using the recorded evidence. Distinguish observations from hypotheses and identify the next useful source or runtime check. Do not claim machine code has been disassembled, function bodies recovered or Java-to-native data flow established without that evidence.
key.direction.javascript=Explain what the recorded file and framework evidence establishes about this JavaScript asset, and identify the next useful source or request to inspect. Read actual source when available. Do not invent script contents, claim a file has executed, or assume compiled or minified business logic has already been recovered.
key.direction.structure=Explain the recorded application structure and its sources. Separate protection indicators, framework observations and file visibility. Identify a useful next inspection without claiming unpacking, native decompilation or runtime verification has occurred.
key.direction.framework=Continue from this framework source evidence: follow its concrete page, request wrapper, storage operation or native bridge into related business code. Read referenced source before concluding and distinguish static links from unverified runtime behavior.
