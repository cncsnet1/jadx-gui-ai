framework.description.configuration=Application configuration was read from the packaged resources. Inspect its actual fields and their source; packaged values do not prove the runtime environment.
framework.description.pages=Page or routing declarations were found in local resources. Follow their source to the relevant business script; a declaration does not establish reachability at runtime.
framework.description.business_scripts=This packaged business script has been read locally. Inspect the recorded source or let AI continue from it; compiled or unreadable portions are recorded separately.
framework.description.requests=A request declaration, call reference or wrapper was recorded. Follow its source to establish parameters, headers, base URLs and callers; these observations have different coverage.
framework.description.auth_storage=Authentication or storage clues were recorded. Trace the actual key, value, readers and request consumers; names alone do not prove a valid credential or exploitable behavior.
framework.description.interceptors=An interceptor or request preprocessing hook was found in the source. Follow its changes to headers, parameters and responses before attributing them to a particular request.
framework.description.native_bridge=A cross-language or native bridge clue was recorded. Inspect the actual declaration or call and its arguments; file presence alone does not establish the target function or behavior.
