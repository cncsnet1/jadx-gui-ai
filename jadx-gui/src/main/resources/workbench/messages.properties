key.direction.crypto=Trace this method's inputs, key and IV origins, algorithm and mode arguments, and where its output is used. Follow callers and consumers. Distinguish recorded constants from arguments proven by source evidence; identify unresolved dynamic values explicitly.
key.direction.identity=Trace the authentication entry, credential handling, token creation or storage, and the request that consumes the session. Keep each conclusion linked to code evidence.
key.direction.config=Trace where this value or configuration is read and used. Distinguish a public identifier from a credential and avoid treating presence alone as a verified issue.
key.direction.entry=Trace this entry point, its reachable calls and its input validation using code evidence. State what remains unverified at runtime.
