key.direction.crypto=追踪这段方法的输入、密钥与 IV 来源、算法与模式参数，以及输出的使用位置。继续查看调用者和数据使用者。区分观察到的常量与有源码依据的实际参数，对未确定的动态值明确说明。
key.direction.identity=追踪认证入口、凭据处理、令牌生成或存储位置，以及使用该会话的网络请求。每项结论都关联代码证据。
key.direction.config=追踪此值或配置的读取和使用位置，区分公开标识与凭据，不要仅因其存在就当作已经验证的问题。
key.direction.entry=结合代码证据追踪此入口、可达调用和输入校验，并说明仍需运行时验证的部分。
