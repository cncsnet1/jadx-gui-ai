key.direction.native=根据记录的证据解释此库已知的 ELF 结构、架构、导入导出符号和 JNI 线索。区分实际观察与假设，指出下一步最有价值的源码或运行时检查。没有相应证据时，不得声称已经反汇编机器码、恢复函数体或确定 Java 到 native 的数据流。
key.direction.javascript=说明记录的文件与框架证据可以确认此 JavaScript 资源的哪些信息，并指出下一步值得查看的源码或请求。可以读取实际来源时再依据代码分析。不要编造脚本内容、声称文件已经执行，或假定已恢复编译或压缩后的业务逻辑。
key.direction.structure=解释记录的应用结构及其来源，区分保护特征、框架观察和文件可见性。给出有价值的下一步检查，不得声称已执行脱壳、native 反编译或运行时验证。
key.direction.framework=沿这条框架源码证据继续分析，追踪具体页面、请求封装、存储操作或 native 桥接对应的业务代码。读取相关来源后再下结论，区分静态关联和尚未验证的运行时行为。
