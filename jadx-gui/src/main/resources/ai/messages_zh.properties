api.dynamic_url=存在 @Url 参数，地址由运行时传入。
api.boundary=声明不代表实际调用或接口可达；普通地址可能来自文档或第三方 SDK。认证可能由拦截器补充，未发现认证头不能证明可匿名访问。相对路径不会与无关主机拼接，请求体类型也不等于 JSON 结构。
api.truncated=该条目的信息超过保存上限，其余内容请查看源码。
api.limit=该类 API 条目已达到上限：
api.coverage=API 条目：%d
analysis.rule.request_builder.title=发现请求构造调用
analysis.rule.request_builder.why=该方法调用了已识别的 HTTP 请求构造器或连接接口。
analysis.rule.request_builder.gap=最终地址、请求方法与参数仍未还原；出现调用不能证明实际执行了网络请求。
analysis.rule.request_builder.next=沿请求对象、输入、拦截器和调用者继续追踪，核对实际请求结构。
api.trace=让 AI 追踪这个请求
api.export=导出全部 API（JSON）
api.summary=显示 %d / %d 项 · 其中 %d 项接口声明 · 尚未验证运行行为
api.empty=开始分析后，这里会整理接口声明、地址线索和请求构造入口。筛选仅影响显示，导出包含全部清单。

analysis.goal.security=核查潜在问题
assessment.title=调查工作台
assessment.queue=核查队列与人工记录
assessment.intro=从上方开始发现。先找入口与方向，再追相关代码，必要时把线索包带到其他工具继续分析。想记录验证结果时，再切换到“做核查”。
assessment.boundary=核查优先级表示先看什么，不代表漏洞等级。线索来自静态观察；“人工已复现 / 人工已排除”由你记录。判断结果前，请查看覆盖范围与缺口。
assessment.metric.secrets=敏感材料线索
assessment.metric.apis=API 声明
assessment.metric.hosts=地址中的主机
assessment.metric.pending=尚未核查
assessment.all_states=全部核查状态
assessment.search=搜索线索或源码位置
assessment.record=记录核查结果
assessment.trace=让 AI 追查这条线索
assessment.scope=覆盖范围与缺口
assessment.shown=显示 %d / %d 条线索 · 数量不等于漏洞数
assessment.state=人工核查
assessment.severity=人工影响评级
assessment.note=核查记录（人工填写）
assessment.location=证据位置
assessment.updated=记录时间（UTC）
assessment.priority=核查顺序
assessment.lead=调查线索
assessment.evidence=证据类型
assessment.observed=01 · 实际观察到什么
assessment.impact=02 · 条件成立时的潜在影响
assessment.evidence_title=证据与来源位置
assessment.empty=发现完成后，这里会列出调查起点。选中一条，查看建议追踪顺序和下一阶段需要携带的材料。
assessment.no_match=当前没有匹配线索，可调整筛选或搜索。空列表不能证明应用没有安全问题。
assessment.review_hint=请记录测试环境、观察到的行为、证据位置，以及还缺什么。“已复现 / 已排除”需要说明依据。备注按原文随项目保存，不自动发送给 AI；导出仅做有限规则脱敏，请避免填写原始凭据。
assessment.note_required=请填写复现依据或排除原因，再保存结论。
assessment.note_limit=核查记录最多 4,000 字符。
assessment.stale=该证据已不属于当前完整评估，请重新选择线索。
assessment.save=保存记录
assessment.cancel=取消
assessment.settings_show=展开分析设置
assessment.settings_hide=收起分析设置
assessment.priority.first=优先核查
assessment.priority.follow_up=继续追踪
assessment.priority.inventory=资产梳理
assessment.status.unreviewed=未核查
assessment.status.investigating=核查中
assessment.status.needs_runtime=待运行验证
assessment.status.reproduced=人工已复现
assessment.status.dismissed=人工已排除
assessment.severity.unassessed=未评级
assessment.severity.info=信息
assessment.severity.low=低
assessment.severity.medium=中
assessment.severity.high=高
assessment.severity.critical=严重
assessment.evidence.static=常量或配置
assessment.evidence.heuristic=行为线索
assessment.api_verify=核查服务端授权时，需记录测试环境、账号角色与对象归属、预期权限边界和实际响应。只有客户端参数名，还不能判断是否越权。
assessment.prompt=按渗透人员的调查顺序组织评估，同时让新手看懂。先概括有证据支持的攻击面和一份短核查队列；每项分开说明实际观察、潜在影响、成立条件、缺失证据和下一步具体核查，引用已有证据。区分 API 声明、地址字符串和请求构造调用，不得猜测基础地址、请求字段、服务端授权行为、成功复现或漏洞分数。客户端对象 ID 不证明越权。明确指出还需要哪些运行时或服务端证据。本次未执行在线验证；人工核查备注未提供，不得猜测其中内容。
analysis.rule.private_key.impact=若材料完整、仍有效且具有敏感权限，可能暴露签名或解密能力。
analysis.rule.credential.impact=若属于仍在使用的共享凭据，可能暴露该身份允许执行的操作。
analysis.rule.token.impact=若令牌有效，可能在失效或撤销前暴露对应账号或服务权限。
analysis.rule.endpoint.impact=可帮助梳理外部依赖；只有网址本身，还无法判断安全影响。
analysis.rule.http_route.impact=请求结构可帮助定位对象、角色和会话边界，进一步核对服务端授权行为。
analysis.rule.request_builder.impact=继续追踪可能还原最终请求，以及认证信息和敏感输入从哪里加入。
analysis.rule.exported.impact=若外部可达且缺少必要校验，可能向其他应用暴露敏感操作或数据。
analysis.rule.debuggable.impact=在满足设备环境条件时，可调试的正式包可能向调试工具暴露运行状态。
analysis.rule.backup.impact=若敏感数据被纳入可用的备份路径，可能超出原有存储边界。
analysis.rule.login.impact=认证流程是核对会话签发、存储、失效和权限边界的调查入口。
analysis.rule.crypto.impact=若参数不当或密钥暴露，可能影响受保护数据的机密性或完整性。
analysis.rule.dynamic.impact=若不可信输入未经充分校验就进入可执行内容，可能运行非预期代码。
analysis.rule.webview.impact=若不可信网页可调用高权限桥接方法，可能暴露应用能力或数据。
analysis.rule.public_config.impact=客户端标识常用于公开分发；实际影响取决于后端规则和服务限制。

analysis.goal.explore=寻找渗透路径
explore.mode=找路径
explore.review_mode=做核查
explore.mode_label=调查方式
explore.metric.entries=应用入口线索
explore.direction=调查方向
explore.target=接下来追
explore.direction.api=接口与服务
explore.direction.entry=应用入口
explore.direction.identity=身份与会话
explore.direction.material=密钥与数据
explore.direction.execution=执行路径
explore.direction.config=环境与配置
explore.intro=从证据起点找方向，沿代码继续追，再把待查问题带到下一工具。建议路线表示调查顺序，并不表示这些环节已经连成可利用的链。
explore.start=01 · 已有起点
explore.route=02 · 建议路线 · 后续环节待追踪
explore.next=03 · 现在先追哪里
explore.handoff=04 · 下一阶段带走什么
explore.boundary=箭头是建议搜索顺序，不证明各环节之间已有调用关系、数据流或可利用性。
explore.package=调查线索包
explore.package_hint=包含当前静态线索、来源位置、建议路线及待查问题，可带到抓包、设备或后端测试环境继续调查。它不是已捕获请求、可执行测试或已验证漏洞报告。
explore.export=导出线索包
explore.prompt=用户在寻找值得继续调查的渗透路径，不一定需要当场评估或判断漏洞。用新手能理解的语言说明入口、关联线索和下一步。每条路线给出：带引用的已有起点、接下来应追的代码或数据、源码已支持的关系、仍待追踪的关系及成立条件、带到抓包工具/设备环境/后端测试环境继续调查的材料。明确区分已观察事实、待追踪环节和运行时问题。一条路线可以停在有用信息，不必生成漏洞结论。不能因共同出现就连接无关域名、凭据、接口或组件；不能虚构完整攻击链、请求载荷或利用成功。本次没有执行运行时或服务端测试。不要要求用户先评级或完成报告。人工核查备注未提供。
analysis.rule.private_key.route_target=材料用途
analysis.rule.private_key.route=私钥标识 → 材料读取位置 → 签名或解密调用 → 使用环境与用途
analysis.rule.private_key.handoff=带走材料位置和候选使用方法，在运行环境追踪是否读取及用于哪项操作。
analysis.rule.credential.route_target=凭据去向
analysis.rule.credential.route=固定值 → 引用位置 → 认证或请求构造 → 身份与权限范围
analysis.rule.credential.handoff=带走赋值点、使用位置和待查启用条件，继续观察实际认证流程。
analysis.rule.token.route_target=请求头构造
analysis.rule.token.route=令牌字符串 → 请求头构造 → 登录后的替换过程 → 会话生命周期
analysis.rule.token.handoff=带走请求头构造和会话更新位置，到流量观察阶段核对运行时实际使用情况。
analysis.rule.endpoint.route_target=地址引用
analysis.rule.endpoint.route=地址字符串 → 使用位置 → 客户端或文档上下文 → 请求细节
analysis.rule.endpoint.handoff=带走主机、路径和来源，先确认属于应用流量、SDK 还是文档，再决定是否进入接口测试。
analysis.rule.http_route.route_target=客户端构造
analysis.rule.http_route.route=接口声明 → 客户端创建 → 基础地址与拦截器 → 业务调用者
analysis.rule.http_route.handoff=带走方法、路径、参数声明、认证线索及未知的基础地址/调用条件，到抓包或后端测试中还原真实请求。
analysis.rule.request_builder.route_target=请求对象
analysis.rule.request_builder.route=构造调用 → 请求对象 → 地址、头与请求体输入 → 业务调用者
