explore.intro=Start from evidence, follow a promising direction, then carry the missing questions to the next tool. Suggested routes are investigation steps, not established exploit chains.
explore.start=01 · Observed starting point
explore.route=02 · Suggested route — later steps still need evidence
explore.next=03 · Next step in the code
explore.handoff=04 · Carry into the next stage
explore.boundary=Arrows describe a search order. They do not establish calls, data flow, reachability or exploitability between those steps.
explore.package=Investigation lead package
explore.package_hint=Contains the selected static lead, source locations, a suggested route and open questions. It is not a captured request, runnable test or verified vulnerability report.
explore.export=Export lead package
explore.prompt=The user is seeking a promising investigation path, not necessarily an assessment or a vulnerability verdict. Explain useful entry points, dependencies and next steps in plain language. For each route give: an observed starting point with citations; the next code or data item to trace; which links are actually supported by the supplied code; the remaining links and preconditions; and what to carry to a network proxy, device session or backend test environment. Label observed facts, untraced links and runtime questions separately. A route may end in useful information without a vulnerability. Never connect unrelated hosts, credentials, interfaces or components because they co-occur. Do not invent a full attack chain, request payload or successful exploitation. No runtime or server tests were performed. Do not require a severity rating or ask the user to complete a report. Manual review notes are not included.
analysis.rule.private_key.route_target=Material usage
analysis.rule.private_key.route=Key marker → reader → signing/decryption call → environment and purpose
analysis.rule.private_key.handoff=Bring source locations and candidate consumers to runtime tracing; determine whether the material is loaded.
analysis.rule.credential.route_target=Credential usage
analysis.rule.credential.route=Fixed value → references → authentication or request construction → identity scope
analysis.rule.credential.handoff=Bring assignment and consumer locations plus the missing usage conditions; inspect the actual authentication flow.
analysis.rule.token.route_target=Header construction
analysis.rule.token.route=Token-shaped string → header builder → replacement after login → session lifecycle
analysis.rule.token.handoff=Bring header construction and session update locations to traffic inspection; check the values used at runtime.
analysis.rule.endpoint.route_target=Address references
analysis.rule.endpoint.route=Address string → usage site → client or document context → request details
analysis.rule.endpoint.handoff=Bring host/path and source locations. First establish whether it belongs to application traffic, an SDK or documentation.
analysis.rule.http_route.route_target=Client construction
analysis.rule.http_route.route=API declaration → client creation → base URL / interceptors → business caller
analysis.rule.http_route.handoff=Bring method, route, declared parameters, authentication clues and missing base URL/context to traffic capture or backend testing.
analysis.rule.request_builder.route_target=Request object
analysis.rule.request_builder.route=Builder call → request object → URL / headers / body inputs → business caller
analysis.rule.request_builder.handoff=Bring constructor and caller locations to runtime tracing; capture the final request before drawing conclusions.
analysis.rule.exported.route_target=Entry handler
analysis.rule.exported.route=Exported declaration → component handler → input parsing → sensitive operations / checks
analysis.rule.exported.handoff=Bring component name, declaration and handler locations; inspect entry conditions on a test device.
analysis.rule.webview.route_target=Page / bridge inputs
analysis.rule.webview.route=WebView call → page source → bridge methods → input handling
analysis.rule.webview.handoff=Bring initialization, page source and bridge locations; inspect which content reaches the bridge at runtime.
analysis.rule.login.route_target=Session lifecycle
analysis.rule.login.route=Authentication lead → inputs → request / response → session storage and consumers
analysis.rule.login.handoff=Bring login callers, session handling and open role questions to traffic or multi-account test sessions.
analysis.rule.crypto.route_target=Key / algorithm inputs
analysis.rule.crypto.route=Cryptographic API → algorithm / key inputs → caller → protected data
analysis.rule.crypto.handoff=Bring algorithm, key source and call locations; trace runtime inputs and the data being protected.
analysis.rule.dynamic.route_target=Executable inputs
analysis.rule.dynamic.route=Loader / process call → path or command input → input source → triggering conditions
analysis.rule.dynamic.handoff=Bring execution entry and input-source locations; inspect origin and validation in the runtime environment.
analysis.rule.debuggable.route_target=Build environment
analysis.rule.debuggable.route=Debug flag → distribution channel → device environment → runtime observation options
analysis.rule.debuggable.handoff=Bring the build/channel context and investigate whether runtime observation can help trace another lead.
analysis.rule.backup.route_target=Storage rules
analysis.rule.backup.route=Backup setting → extraction rules → stored data → platform conditions
analysis.rule.backup.handoff=Bring backup rules and candidate storage paths; check applicable behavior on the relevant Android version.
analysis.rule.public_config.route_target=Service ownership
analysis.rule.public_config.route=Client identifier → SDK initialization → service usage → backend restrictions
analysis.rule.public_config.handoff=Bring the service association and open restriction questions to the service configuration or backend review.

