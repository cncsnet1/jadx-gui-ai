prompt_explain=Explain the purpose, inputs, outputs and key behavior of this code. Suggest useful comments. Cite source IDs.
prompt_audit=Review this code for security concerns. Separate observed facts from hypotheses. For each concern give evidence, prerequisites, impact and what still needs verification. Cite source IDs. Do not claim a vulnerability merely from a suspicious API.
prompt_trace=Trace the logic and the available caller relationships. State what this context can and cannot prove, and name the next concrete code location to inspect. Cite source IDs.
prompt_rename=Suggest one clearer name for the primary symbol. Return only JSON with string fields name and reason. Preserve behavior. Base the suggestion on the supplied source.
