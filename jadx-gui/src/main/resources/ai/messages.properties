assessment.severity.high=High
assessment.severity.critical=Critical
assessment.evidence.static=Static value / config
assessment.evidence.heuristic=Behavioral lead
assessment.api_verify=To assess server authorization, record the test environment, account roles and object ownership, expected permission boundary, and observed responses. Client parameter names alone do not establish broken authorization.
assessment.prompt=Organize this assessment for a penetration tester, using language a beginner understands. Prioritize the observed attack surface and a short investigation queue. For each lead separate observation, potential impact, preconditions, missing evidence, and the next concrete verification step. Cite evidence. Distinguish API declarations from URL strings and request construction calls. Do not invent base URLs, request fields, server authorization behavior, successful reproduction, or severity scores. Client object IDs do not prove broken authorization. Explicitly say which runtime or server evidence is still needed. No live tests were performed. Human review notes are not included and must not be inferred.
analysis.rule.private_key.impact=A complete, active key with sensitive privileges could expose signing or decryption capabilities.
analysis.rule.credential.impact=An active shared credential could expose the actions allowed to that identity.
analysis.rule.token.impact=An active token could expose its account or service permissions until it expires or is revoked.
analysis.rule.endpoint.impact=This identifies a possible external dependency. A URL alone establishes no security impact.
analysis.rule.http_route.impact=Request structure helps locate object, role, and session boundaries that need server-side verification.
analysis.rule.request_builder.impact=Tracing this call may reveal the final request and where authentication or sensitive inputs are attached.
analysis.rule.exported.impact=A reachable component without required checks could expose sensitive operations or data to other apps.
analysis.rule.debuggable.impact=In an applicable device environment, a debuggable release may expose app runtime state to debugging tools.
analysis.rule.backup.impact=If sensitive data is included in an available backup path, it may be exposed outside its intended storage boundary.
analysis.rule.login.impact=The authentication flow is a place to review session issuance, storage, expiry, and privilege boundaries.
analysis.rule.crypto.impact=Weak parameters or exposed keys could undermine the confidentiality or integrity of protected data.
analysis.rule.dynamic.impact=If an untrusted input reaches executable content without sufficient checks, unintended code may run.
analysis.rule.webview.impact=If untrusted web content can reach a privileged bridge, app capabilities or data may be exposed.
analysis.rule.public_config.impact=Client identifiers are often public. Impact depends on actual backend rules and service restrictions.

