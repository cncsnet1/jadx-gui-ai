welcome=## Understand the code in context\n\nChoose a method or select code, then pick a task.\n\n- **Explain** responsibilities and key behavior.\n- **Trace** logic and inspect callers.\n- **Audit** evidence and verification gaps.\n- **Name** a symbol more clearly.\n\nSave useful findings to investigation records. Source citations remain linked to the original symbols.
