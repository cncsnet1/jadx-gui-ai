analysis.limits=Scope: bytecode string constants, named field constants, HTTP annotations and supported text resources. Native libraries, runtime-decrypted strings and server-side behavior are not analyzed. AI reads a bounded selection, not every method. A URL, exported component or keyword is not proof of a vulnerability; credentials are not tested online. No findings does not establish safety.
